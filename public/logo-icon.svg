<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="tealGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1B6972" />
      <stop offset="100%" stop-color="#135059" />
    </radialGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#B86E18" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Rounded Square Emblem matching user's logo -->
  <rect x="8" y="8" width="184" height="184" rx="28" fill="url(#tealGrad)" />
  <!-- Script Text Zariya -->
  <text x="100" y="120" text-anchor="middle" font-family="'Alex Brush', 'Great Vibes', cursive, 'Brush Script MT'" font-size="58" fill="#ECA429" font-style="italic" filter="url(#goldGlow)">Zariya</text>
</svg>
