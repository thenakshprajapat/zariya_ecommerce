<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="tealGrad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1F7380" />
      <stop offset="100%" stop-color="#144F59" />
    </radialGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#B86E18" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Teal Circle Emblem from Logo -->
  <circle cx="100" cy="100" r="92" fill="url(#tealGrad)" />
  <!-- Script Text Zariya -->
  <text x="100" y="112" text-anchor="middle" font-family="'Alex Brush', 'Great Vibes', cursive, 'Brush Script MT'" font-size="52" fill="#ECA429" font-style="italic" filter="url(#goldGlow)">Zariya</text>
</svg>
